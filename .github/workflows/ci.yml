name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler:
          - gcc
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-apt-

      - uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ runner.os }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - run: |
          sudo apt-get update
          sudo apt-get install -y cmake curl git libjudy-dev libgmp-dev libpcap-dev libboost-all-dev libevent-dev libtool flex bison pkg-config libssl-dev libgmp10 libjudydebian1 libpcap0.8 python3 python3-pip python3-dev python3-tk graphviz

      - run: |
          ccache -M 1G
          ccache -z
          bash tools/install-thrift.sh
          git clone https://github.com/p4lang/behavioral-model.git
          cd behavioral-model
          bash travis/install-nanomsg.sh
          chmod +x ./autogen.sh && ./autogen.sh
          ./configure 'CXXFLAGS=-Wno-sign-compare'
          make && sudo make install
          cd ..
          sudo ldconfig
          simple_switch --version
          chmod +x ./tools/install.sh && ./tools/install.sh
          source my-venv/bin/activate
          pytest
          ccache -s